<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ahmed's HomeLab architecture</title>
  <desc id="desc">Dark themed architecture diagram showing Internet, Cloudflare Tunnel, ports 80/81/443 + cloudflared, Docker host, Proxmox cluster • live read-only snapshot, ZFS storage, backups, and monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.85"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
    <style>
      .title{font:700 28px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;fill:#e2e8f0}
      .sub{font:500 13px 'JetBrains Mono', ui-monospace, monospace;fill:#94a3b8}
      .label{font:700 14px 'JetBrains Mono', ui-monospace, monospace;fill:#f8fafc}
      .small{font:500 10px 'JetBrains Mono', ui-monospace, monospace;fill:#cbd5e1}
      .tiny{font:500 9px 'JetBrains Mono', ui-monospace, monospace;fill:#94a3b8}
      .line{fill:none;stroke:#38bdf8;stroke-width:2.2;marker-end:url(#arrow);opacity:.9}
      .greenline{fill:none;stroke:#34d399;stroke-width:2.2;marker-end:url(#arrowGreen);opacity:.9}
      .amberline{fill:none;stroke:#fbbf24;stroke-width:2.2;marker-end:url(#arrowAmber);opacity:.9}
      .dash{stroke-dasharray:7 5}
      .boxbg{fill:#0f172a;rx:14}
      .cyan{fill:rgba(8,51,68,.55);stroke:#22d3ee;stroke-width:1.8;rx:14}
      .green{fill:rgba(6,78,59,.55);stroke:#34d399;stroke-width:1.8;rx:14}
      .violet{fill:rgba(76,29,149,.55);stroke:#a78bfa;stroke-width:1.8;rx:14}
      .amber{fill:rgba(120,53,15,.45);stroke:#fbbf24;stroke-width:1.8;rx:14}
      .rose{fill:rgba(136,19,55,.45);stroke:#fb7185;stroke-width:1.8;rx:14}
      .slate{fill:rgba(30,41,59,.72);stroke:#94a3b8;stroke-width:1.8;rx:14}
      .boundary{fill:rgba(15,23,42,.34);stroke:#475569;stroke-width:1.4;stroke-dasharray:10 6;rx:22}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)" opacity="0.75"/>
  <circle cx="1010" cy="100" r="180" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="145" cy="650" r="180" fill="#a78bfa" opacity="0.08"/>

  <text x="52" y="58" class="title">Ahmed's HomeLab</text>
  <text x="52" y="84" class="sub">Proxmox VE 9.2.4 • CT999 Ubuntu Docker/NAS • tank + backupmini ZFS • Cloudflare/NPM • monitored backups</text>

  <!-- boundaries -->
  <rect x="390" y="126" width="760" height="548" class="boundary"/>
  <text x="410" y="154" class="small">Proxmox cluster • live read-only snapshot</text>
  <rect x="430" y="190" width="330" height="420" class="boundary" opacity=".95"/>
  <text x="452" y="216" class="small">Main node: proxmox</text>
  <rect x="800" y="190" width="310" height="420" class="boundary" opacity=".95"/>
  <text x="822" y="216" class="small">Mini node: proxmoxmini</text>

  <!-- arrows behind boxes -->
  <path d="M150 220 C230 220 250 220 320 220" class="line"/>
  <path d="M320 220 C365 220 378 250 430 286" class="line"/>
  <path d="M610 286 C650 286 670 286 710 286" class="greenline"/>
  <path d="M590 346 L590 438" class="greenline"/>
  <path d="M590 510 L590 570" class="greenline"/>
  <path d="M760 505 C800 505 812 505 852 505" class="amberline"/>
  <path d="M955 442 L955 365" class="amberline"/>
  <path d="M955 365 C955 320 912 302 760 302" class="amberline dash"/>
  <path d="M710 338 C760 390 815 415 855 442" class="line dash"/>

  <!-- external -->
  <rect x="42" y="172" width="108" height="96" class="boxbg"/><rect x="42" y="172" width="108" height="96" class="slate" filter="url(#glow)"/>
  <text x="67" y="207" class="label">Internet</text><text x="57" y="232" class="small">selected public</text><text x="71" y="247" class="small">services</text>

  <rect x="230" y="172" width="130" height="96" class="boxbg"/><rect x="230" y="172" width="130" height="96" class="amber" filter="url(#glow)"/>
  <text x="255" y="206" class="label">Cloudflare</text><text x="264" y="231" class="small">Tunnel / DNS</text>

  <!-- main node -->
  <rect x="460" y="244" width="150" height="84" class="boxbg"/><rect x="460" y="244" width="150" height="84" class="cyan"/>
  <text x="492" y="278" class="label">NPM + Tunnel</text><text x="481" y="303" class="small">ports 80/81/443 + cloudflared</text>

  <rect x="710" y="244" width="140" height="84" class="boxbg"/><rect x="710" y="244" width="140" height="84" class="green"/>
  <text x="752" y="278" class="label">CT999 Ubuntu</text><text x="728" y="303" class="small">main Docker + NAS LXC</text>

  <rect x="460" y="438" width="260" height="108" class="boxbg"/><rect x="460" y="438" width="260" height="108" class="green"/>
  <text x="492" y="474" class="label">Docker apps on CT999</text>
  <text x="482" y="500" class="small">Nextcloud • Immich v3.1 • Plex • n8n</text>
  <text x="482" y="518" class="small">Vaultwarden • Sonarr • Bazarr • Grafana</text>

  <rect x="460" y="570" width="260" height="72" class="boxbg"/><rect x="460" y="570" width="260" height="72" class="violet"/>
  <text x="520" y="604" class="label">ZFS: tank ONLINE</text><text x="500" y="626" class="small">~4 TB pool for NAS/app data/backups</text>

  <!-- mini node -->
  <rect x="855" y="244" width="200" height="88" class="boxbg"/><rect x="855" y="244" width="200" height="88" class="cyan"/>
  <text x="908" y="280" class="label">VM100 Hermes</text><text x="900" y="305" class="small">runs on proxmoxmini</text>

  <rect x="855" y="442" width="200" height="88" class="boxbg"/><rect x="855" y="442" width="200" height="88" class="violet"/>
  <text x="892" y="478" class="label">ZFS: backupmini ONLINE</text><text x="895" y="503" class="small">~1 TB secondary backup tier</text>

  <rect x="855" y="570" width="200" height="72" class="boxbg"/><rect x="855" y="570" width="200" height="72" class="rose"/>
  <text x="910" y="604" class="label">Backup flows</text><text x="892" y="626" class="small">CT999 → tank • main → mini tier</text>

  <!-- observability -->
  <rect x="86" y="488" width="238" height="112" class="boxbg"/><rect x="86" y="488" width="238" height="112" class="slate"/>
  <text x="126" y="526" class="label">Observability</text>
  <text x="114" y="552" class="small">Grafana 13 • Prometheus</text>
  <text x="116" y="570" class="small">Uptime Kuma • Telegram relay</text>
  <path d="M324 544 C380 544 405 520 460 505" class="line dash"/>

  <!-- legend -->
  <rect x="52" y="682" width="1096" height="42" rx="12" fill="rgba(15,23,42,.8)" stroke="#334155"/>
  <circle cx="82" cy="704" r="6" fill="#22d3ee"/><text x="96" y="708" class="tiny">access/routing</text>
  <circle cx="218" cy="704" r="6" fill="#34d399"/><text x="232" y="708" class="tiny">compute/apps</text>
  <circle cx="354" cy="704" r="6" fill="#a78bfa"/><text x="368" y="708" class="tiny">storage</text>
  <circle cx="475" cy="704" r="6" fill="#fbbf24"/><text x="489" y="708" class="tiny">backup path</text>
  <circle cx="604" cy="704" r="6" fill="#fb7185"/><text x="618" y="708" class="tiny">safety / recovery</text>
  <text x="905" y="708" class="tiny">Public docs: secrets omitted by design</text>
</svg>
